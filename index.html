<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>My Gallery</title>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">MY PHOTOS</p>
      <h1>Gallery</h1>
    </div>
    <div class="top-actions">
      <button id="themeBtn" class="icon-btn" title="Toggle theme">🌙</button>
      <label class="compress-toggle" title="Compress photos before saving">
     <input id="compressToggle" type="checkbox"> Compress
       </label>
      <label class="add-btn">
        <input id="photoInput" type="file" accept="image/*" multiple>
        <span>＋ Add</span>
      </label>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <h2>Your memories, in one place.</h2>
        <p id="stats">No photos yet.</p>
      </div>
      <button id="clearBtn" class="clear-btn">Clear all</button>
    </section>

    <section class="toolbar">
      <input id="searchInput" class="search" type="search" placeholder="Search by name or tag…">
      <select id="sortSelect" class="sort">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="name">Name (A–Z)</option>
        <option value="custom">Custom order (drag)</option>
      </select>
      <button id="favFilterBtn" class="chip-btn">★ Favorites</button>
      <button id="selectBtn" class="chip-btn">Select</button>
      <button id="viewModeBtn" class="chip-btn">🕘 Timeline</button>
    </section>

    <section id="albumBar" class="album-bar">
      <div id="breadcrumb" class="breadcrumb"></div>
      <button id="newAlbumBtn" class="chip-btn">＋ New Album</button>
    </section>

    <section id="bulkBar" class="bulk-bar hidden">
      <span id="selectCount">0 selected</span>
      <div class="bulk-actions">
        <button id="bulkMove">Move</button>
        <button id="bulkDownload">Download</button>
        <button id="bulkDelete" class="danger">Delete</button>
        <button id="bulkCancel">Cancel</button>
      </div>
    </section>

    <div id="dropzone" class="dropzone hidden">Drop photos to add them</div>
    <div id="folderGrid" class="folder-grid"></div>
    <div id="gallery" class="gallery"></div>
    <p id="empty" class="empty">No photos yet. Tap <b>＋ Add</b> or drag photos here.</p>
    <p id="noResults" class="empty hidden">No photos match your search.</p>
  </main>

  <div id="albumPicker" class="modal-overlay hidden">
    <div class="modal">
      <h3>Move to album</h3>
      <div id="albumPickerList" class="album-picker-list"></div>
      <button id="albumPickerCancel" class="chip-btn">Cancel</button>
    </div>
  </div>

  <div id="viewer" class="viewer hidden">
    <button id="closeViewer" class="v-btn close" title="Close">×</button>
    <button id="prevBtn" class="v-btn nav prev" title="Previous">‹</button>
    <button id="nextBtn" class="v-btn nav next" title="Next">›</button>
    <img id="viewerImg" alt="Selected photo">
    <div class="viewer-bar">
      <button id="viewerFav" class="v-btn" title="Favorite">☆</button>
      <button id="viewerMove" class="v-btn" title="Move to album">📁</button>
      <button id="viewerEdit" class="v-btn" title="Edit photo">✎</button>
      <button id="viewerDownload" class="v-btn" title="Download">⬇</button>
      <button id="viewerDelete" class="v-btn" title="Delete">🗑</button>
    </div>
    <div class="viewer-tags">
      <input id="captionInput" class="caption-input" placeholder="Add a caption…">
      <div id="tagChips" class="tag-chips"></div>
      <input id="tagInput" class="tag-input" placeholder="Add tag + Enter">
    </div>
  </div>
  <div id="editorModal" class="modal-overlay hidden">
  <div class="editor-panel">
    <div class="editor-canvas-wrap">
      <canvas id="edCanvas"></canvas>
      <div id="cropBox" class="crop-box hidden"></div>
    </div>
    <div class="editor-controls">
      <div class="ed-row">
        <button id="rotateLeft" class="chip-btn">⟲ Rotate</button>
        <button id="rotateRight" class="chip-btn">⟳ Rotate</button>
        <button id="resetCrop" class="chip-btn">Reset Crop</button>
      </div>
      <div class="ed-row filters">
        <button class="filter-btn chip-btn active" data-filter="none">None</button>
        <button class="filter-btn chip-btn" data-filter="bw">B&amp;W</button>
        <button class="filter-btn chip-btn" data-filter="sepia">Sepia</button>
        <button class="filter-btn chip-btn" data-filter="vintage">Vintage</button>
      </div>
      <label class="ed-slider">Brightness
        <input id="brightnessSlider" type="range" min="50" max="150" value="100">
      </label>
      <label class="ed-slider">Contrast
        <input id="contrastSlider" type="range" min="50" max="150" value="100">
      </label>
      <p class="ed-hint">Drag on the photo to crop.</p>
      <div class="ed-row">
        <button id="editorSave" class="chip-btn active">Save</button>
        <button id="editorCancel" class="chip-btn">Cancel</button>
      </div>
    </div>
  </div>
</div>

  <script src="app.js"></script>
</body>
</html>
